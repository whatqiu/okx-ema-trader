# 第一阶段仅订阅 OKX 公共行情，不会下单
symbol: BTC-USDT-SWAP
bar_5m: 5m
bar_15m: 15m
candle_limit: 200

strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  # ADX 必须严格大于该值：adx <= adx_min 即无信号。
  adx_min: 20
  # 15m 偏离度过滤：abs(close - EMA20) / EMA20 <= deviation_max 才允许新开仓。
  # 只作用于 15m，只作为入场过滤，不影响已持有的仓位。
  deviation_max: 0.02
  # 5m 触发方式：
  #   crossover（默认）= EMA20/50 交叉，是一个"事件"，只在那一根触发
  #   pullback         = 回调触及 5m 快速均线，是一个"状态"，需要闩锁
  #
  # 实测结论（31 天真实 K 线 × 5 币种，tools/test_pullback.py）：回调的
  # 毛收益转正（−72.6% → +29.3%），但换手从 72 涨到 201 笔，每单位盈亏平衡
  # 成本只有 7.3 bps，低于真实约 8 bps —— 净收益 −2.9%，5 个 tolerance 值
  # 全部为负。所以它是一个可测量、可切换的选项，**不是**一个改进。
  # 想自己复现结论：python tools/test_pullback.py
  entry_mode: crossover
  # 仅 entry_mode: pullback 时生效。多接近快速均线算"触及"，必须 > 0
  # （等于 0 时价格几乎不会正好落在均线上，等于永不触发）。
  pullback_tolerance: 0.002

runtime:
  reconnect_seconds: 5
  log_level: INFO

# 自动交易设置。只在 OKX 模拟盘（demo）执行；实盘 profile 会被 credentials.py 直接拒绝。
#
# ── 杠杆与强平距离（满仓时，价格反向多少会被强平）──
#   1x ~99%   2x ~49%   5x ~19%   10x ~9.5%   20x ~4.7%   25x ~3.8%   50x ~2%
#
# ⚠️ 止损必须挂在强平价**之内**，否则它永远等不到成交。config.validate() 会
# 拒绝 stop_loss_pct >= 100/leverage 的组合（50x + 2% 就是这种），所以这一条
# 不靠自觉。
#
# 2026-10-14 的账户实盘（37 笔）里，两笔 50x 强平（-204% / -274%）就是这个
# 边界：止损挂在 2%，强平距离也是 2%，止损单和强平赛跑，插针就输。按本仓库
# 真实入场点重放，同一批30 笔在 10-20x + 2% 止损下零爆仓、回撤 27%-55%。
#
# sizing_mode: risk（推荐）
#   每笔仓位由"亏到止损时亏掉账户的百分之几"反推，公式里没有杠杆：
#       仓位名义 = 权益 × risk_per_trade_pct / stop_loss_pct
#   好处是杠杆只影响占用的保证金，不放大单笔风险——想用高杠杆省保证金而
#   不承担高风险，就用这个模式。1% 的预算在 10x 和 50x 下是同一个仓位。
trading:
  enabled: true
  # 统一使用 OKX instId 格式。MU 永续 = MU-USDT-SWAP（不要写 MUUSDT，
  # broker 的 to_ccxt_symbol 按 "-" 切分，写错会拼出不存在的市场）。
  symbols: [BTC-USDT-SWAP, AAVE-USDT-SWAP, MU-USDT-SWAP, ZEC-USDT-SWAP]
  # sizing_mode: fixed   -> 每笔固定 notional_usdt 名义价值
  #              equity  -> 每笔为账户权益的 equity_pct%
  #              risk    -> 每笔亏到止损时亏掉权益的 risk_per_trade_pct%
  #                            （唯一一种"仓位大小"和"能亏多少"直接挂钩的模式）
  sizing_mode: risk
  notional_usdt: 100
  equity_pct: 20
  # 单笔风险预算（%）。1 ≈ 连亏 10 次还剩 90%。validate() 的上限是 25%：
  # 超过它的配置会被拒，因为"一次止损亏掉半个账户"会让熔断形同虚设。
  risk_per_trade_pct: 1.0
  # 20x：强平距离约 4.7%，2% 止损留有 2.7% 缓冲。杠杆在这里只决定保证金占用，
  # 不决定单笔风险（sizing_mode: risk 把这一层解耦了）。
  leverage: 20
  # 止盈止损都是"相对成交价的百分比"，不是账户收益率。
  # 2% 名义止损在 risk 模式下 = 账户的1%（由 risk_per_trade_pct 决定）。
  # 实测 MAE：盈利笔最大不利波动 1.98%，2% 刚好不误杀。
  stop_loss_pct: 2.0
  # 0 = 只挂止损，不挂止盈。趋势策略的出场靠反向信号或止损，主动止盈会在
  # 趋势走完前砍掉持仓（实测盈利笔的 MFE 中位仅 1.65%，设 2% 止盈等于
  # 把右尾截断）。
  take_profit_pct: 0.0
  # 单笔敞口上限。以 1%风险 / 2% 止损算，仓位名义 = 权益的 50%；这里给
  # 5 倍权益，够 10 个标的同时满额开仓。executor 仍会逐笔检查
  # `max_total_notional` 与可用保证金。
  max_total_notional: 500000
  position_mode: cross

# 账户级熔断。只对"会真下单的那条路径"生效（executor.py）；策略判定完全不
# 参与。触发后平仓并停手，halt 会写进 state.yaml，重启不解除，需要人工
# `--reset-halt`（或手改 state.yaml 的 risk 段）。
#
# 三个阈值都能省略：省略 = 用代码默认 / 按 stop_loss_pct × leverage 自动推导。
# 省略（None）和写 0 是两回事：0 = 明确关掉这一条，None = 我没意见。
#
# 回撤基准是"历史最高权益"（持久化在 state.yaml 的 risk.peak_equity）——
# 不是"今天"，也不是"这次启动"：重启不会把已经亏掉的部分变回额度。
risk:
  # 账户回撤上限，自历史最高权益起算。
  # 注意：单笔风险 1% 时，连亏 61 笔才会到这个数——它不是主力，是"前两条
  # 都没拦住"时的兜底。真正先触发的是连亏熔断。
  max_drawdown_pct: 60
  # 连续亏损笔数上限。平仓时才知道盈亏，所以这个计数平仓后才更新。
  #
  # 5 而不是 3：1% 单笔风险下，3 连亏只亏 3% 权益就停手过于敏感。按实测胜率
  # 57% 算，连续 3 亏的概率 8.0%，在 30 笔样本里出现至少一次的概率 91.7%
  # —— 也就是十次交易停九次，机器人基本不干活。5 连亏的概率 1.7%（30 笔内
  # 出现 40%），停手才是"真的不对劲"的信号。
  max_consecutive_losses: 5
  # max_position_loss_pct 省略 = 由 account_risk_per_trade_pct 自动推导
  #（risk 模式下 = risk_per_trade_pct，这里是 1%）。它的作用是抓"止损没挂上
  # 或跳空穿了"——正常止损成交时浮亏恰好在阈值附近，止损失效时会明显超出。
  #
  # 5 连亏 = 亏掉 5% 权益后停手。这是有意的保守：胜率 57% 时 5 连亏的概率
  # 只有 1.7%，它捕捉的是"策略失效"而不是"运气不好"。
