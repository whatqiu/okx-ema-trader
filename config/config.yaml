# 第一阶段仅订阅 OKX 公共行情，不会下单
symbol: BTC-USDT-SWAP
bar_5m: 5m
bar_15m: 15m
candle_limit: 200

strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 14
  # ADX 必须严格大于该值：adx <= adx_min 即无信号。
  adx_min: 20
  # 15m 偏离度过滤：abs(close - EMA20) / EMA20 <= deviation_max 才允许新开仓。
  # 只作用于 15m，只作为入场过滤，不影响已持有的仓位。
  deviation_max: 0.02

runtime:
  reconnect_seconds: 5
  log_level: INFO

# 自动交易设置。只在 OKX 模拟盘（demo）执行；实盘 profile 会被 credentials.py 直接拒绝。
#
# 杠杆与强平距离（满仓时，价格反向多少会被强平）：
#   1x ~99%   2x ~49%   5x ~19%   10x ~9.5%   20x ~4.7%   25x ~3.8%   50x ~2%
#
# ⚠️ 当前 25x + 2% 止损：强平距离约 3.8%，止损挂在 2%——**缓冲只有 1.8%**。
# 一根插针或跳空就可能穿过止损直接强平，此时止损单是市价单，成交价会更差。
# 这是为了拿到"2% 波动 = 50% 仓位盈亏"的代价，不是免费的。
trading:
  enabled: true
  # 统一使用 OKX instId 格式。MU 永续 = MU-USDT-SWAP（不要写 MUUSDT，
  # broker 的 to_ccxt_symbol 按 "-" 切分，写错会拼出不存在的市场）。
  symbols: [BTC-USDT-SWAP, AAVE-USDT-SWAP, MU-USDT-SWAP, ZEC-USDT-SWAP]
  # sizing_mode: fixed   -> 每笔固定 notional_usdt 名义价值
  #              equity  -> 每笔为账户权益的 equity_pct%
  sizing_mode: equity
  notional_usdt: 100
  # 每笔用账户权益的 20%。cross 模式下这也是该笔占用的保证金，
  # 5 个标的全开会占满 100% 保证金——没有加仓余量，且任一仓亏损都会
  # 挤压其余仓位的强平距离（cross 是共享保证金的）。
  equity_pct: 20
  leverage: 25
  # 止盈止损都是"相对成交价的百分比"，不是账户收益率。
  # 25x 下价格走 2% = 仓位盈亏 50% = 账户盈亏 50% × 20% = 10% 权益。
  # 连续 10 次止损即归零，风控段（连亏 3 笔、回撤 60%）就是为这个设的。
  stop_loss_pct: 2.0
  take_profit_pct: 2.0
  # 单笔敞口 = 权益 × 20% × 25 = 5 倍权益；5 个标的全开即 25 倍权益。
  max_total_notional: 500000
  position_mode: cross

# 账户级熔断。只对"会真下单的那条路径"生效（executor.py）；策略判定完全不
# 参与。触发后平仓并停手，halt 会写进 state.yaml，重启不解除，需要人工
# `--reset-halt`（或手改 state.yaml 的 risk 段）。
#
# 三个阈值都能省略：省略 = 用代码默认 / 按 stop_loss_pct × leverage 自动推导。
# 省略（None）和写 0 是两回事：0 = 明确关掉这一条，None = 我没意见。
#
# 回撤基准是"历史最高权益"（持久化在 state.yaml 的 risk.peak_equity）——
# 不是"今天"，也不是"这次启动"：重启不会把已经亏掉的部分变回额度。
risk:
  # 账户回撤上限，自历史最高权益起算。60 ≈ 两次满仓 10x 止损（2 × 30%），
  # 第三次之前停手。想一次止损就停手就写 30。
  max_drawdown_pct: 60
  # 连续亏损笔数上限。平仓时才知道盈亏，所以这个计数平仓后才更新。
  max_consecutive_losses: 3
  # max_position_loss_pct 省略 = 由 stop_loss_pct × leverage 自动推导（3 × 10 = 30）。
  # 这一条通常是"止损没挂上或跳空穿了"的信号，触发即停手。
